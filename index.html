<script src="https://cdn.tailwindcss.com"></script>
<!-- React & ReactDOM UMD -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<!-- Babel Standalone for in-browser JSX parsing -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<!-- PapaParse for CSV -->
<script src="https://unpkg.com/papaparse@5/papaparse.min.js"></script>
<style>
  body { background: #f1f5f0; }
  .scrollbar-none::-webkit-scrollbar { display: none; }
  .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .animate-fade-in { animation: fadeIn 0.3s ease forwards; }
  @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
  .shimmer { background: linear-gradient(90deg, #f0f4ec 25%, #e4edda 50%, #f0f4ec 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
  .win-card { transition: all 0.2s ease; }
  .win-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(6,33,21,0.12); }
</style>

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo, useCallback } = React;

// ─── CONFIG ──────────────────────────────────────────────────────────────────
const DEFAULT_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQzylxdGAnbrbVrz8-bCmgMP3NZhnUhih6eYyxfZc-bRJLvBx6EIq0_xLmbal_zG2XKZFY261yaoUJ_/pub?gid=454833638&single=true&output=csv';

const TEAMS = [
  { id: 'all', label: 'All Teams', full: null },
  { id: 'anz', label: 'ANZ', full: 'ANZ - People Service' },
  { id: 'manila-na', label: 'Manila - NA', full: 'Manila - NA - People Services' },
  { id: 'manila-ps', label: 'Manila', full: 'Manila - People Service' },
  { id: 'na-ps', label: 'NA', full: 'NA - People Service' },
  { id: 'opex', label: 'OPEX', full: 'OPEX' },
  { id: 'sekg-payroll', label: 'SE/KG Payroll', full: 'SE/KG - Payroll' },
  { id: 'sekg-ps', label: 'SE/KG People', full: 'SE/KG - People Services' },
];

// ─── COLUMN MAP ───────────────────────────────────────────────────────────────
const jCol = {
  issueKey: 0, issueId: 1, summary: 2, reporter: 3,
  dept: 5, status: 14, description: 19, created: 26,
  effectiveSavings: 8, totalCount: 9,
  startDate: 11, actualEnd: 13, plannedEnd: 12,
  businessImpact: 7, solution: 19, stageGate: 15,
};

const RESOLVED_STATUSES = ['resolved', 'done', 'complete', 'completed'];

// ─── HELPERS ──────────────────────────────────────────────────────────────────
const g = (row, idx) => (idx >= 0 && idx < row.length) ? row[idx] : null;

function parseDateSafe(val) {
  if (!val) return null;
  const d = new Date(val);
  return isNaN(d.getTime()) ? null : d;
}

function fetchCsv(url) {
  return new Promise((resolve, reject) => {
    Papa.parse(url, {
      download: true, skipEmptyLines: true,
      complete: r => resolve(r.data),
      error: e => reject(e),
    });
  });
}

function formatDate(d) {
  if (!d) return '—';
  return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
}

// ─── AVATAR ──────────────────────────────────────────────────────────────────
function Avatar({ name }) {
  const initials = name ? name.split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase() : '?';
  const colors = ['#2d6a4f','#1e6091','#7b2d8b','#c05621','#276749','#1a365d','#744210'];
  const color = colors[name ? name.charCodeAt(0) % colors.length : 0];
  return (
    <div className="w-9 h-9 rounded-full flex items-center justify-center text-white text-xs font-black shrink-0 ring-2 ring-white shadow-sm"
      style={{ backgroundColor: color }}>
      {initials}
    </div>
  );
}

// ─── OWNER BADGE ─────────────────────────────────────────────────────────────
function OwnerBadge({ name, large = false }) {
  const colors = ['#2d6a4f','#1e6091','#7b2d8b','#c05621','#276749','#1a365d','#744210'];
  const color = colors[name ? name.charCodeAt(0) % colors.length : 0];
  return (
    <div className={`inline-flex items-center gap-2 rounded-full px-3 py-1 font-bold ${large ? 'text-sm' : 'text-xs'}`}
      style={{ backgroundColor: color + '20', color, border: `1.5px solid ${color}40` }}>
      <Avatar name={name} />
      <span>{name || '—'}</span>
      {large && <span className="text-base">🌟</span>}
    </div>
  );
}

// ─── STAT CARD ────────────────────────────────────────────────────────────────
function StatCard({ label, value, sub, icon, color = 'text-[#062115]' }) {
  return (
    <div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-5">
      <div className="flex items-start justify-between mb-3">
        <span className="text-[10px] font-black uppercase tracking-widest text-slate-400">{label}</span>
        <span>{icon}</span>
      </div>
      <div className={`text-3xl font-black tracking-tight ${color}`}>{value}</div>
      {sub && <div className="text-xs text-slate-400 font-semibold mt-1">{sub}</div>}
    </div>
  );
}

// ─── PROJECT MODAL ────────────────────────────────────────────────────────────
function ProjectModal({ project, onClose }) {
  const hours = project.effectiveSavings > 0 && project.totalCount > 0
    ? ((project.effectiveSavings * project.totalCount) / 60).toFixed(1)
    : null;

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" onClick={onClose}>
      <div className="absolute inset-0 bg-black/50 backdrop-blur-sm" />
      <div className="relative bg-white rounded-3xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto animate-fade-in"
        onClick={e => e.stopPropagation()}>

        {/* Header */}
        <div className="bg-[#062115] rounded-t-3xl p-6 relative overflow-hidden">
          <div className="absolute inset-0 opacity-10"
            style={{ background: 'radial-gradient(ellipse at top right, #91c13e 0%, transparent 60%)' }} />
          <div className="relative">
            <div className="flex items-start justify-between gap-4 mb-4">
              <span className="text-xs font-black uppercase tracking-widest text-[#91c13e] bg-[#91c13e]/10 px-3 py-1 rounded-full border border-[#91c13e]/20">
                ✅ {project.issueKey}
              </span>
              <button onClick={onClose}
                className="text-white/50 hover:text-white transition-colors text-xl leading-none">✕</button>
            </div>
            <h2 className="text-xl font-black text-white leading-tight mb-4">{project.summary}</h2>
            <OwnerBadge name={project.reporter} large={true} />
          </div>
        </div>

        {/* Body */}
        <div className="p-6 space-y-5">

          {/* Metrics Row */}
          <div className="grid grid-cols-3 gap-3">
            <div className="bg-[#f4f9ec] rounded-2xl p-4 text-center border border-[#e4edda]">
              <div className="text-2xl font-black text-[#062115]">
                {project.effectiveSavings > 0 ? project.effectiveSavings.toLocaleString() : '—'}
              </div>
              <div className="text-[10px] font-black uppercase tracking-wider text-[#6e9514] mt-1">Min / Occurrence</div>
            </div>
            <div className="bg-[#f4f9ec] rounded-2xl p-4 text-center border border-[#e4edda]">
              <div className="text-2xl font-black text-[#062115]">
                {project.totalCount > 0 ? project.totalCount.toLocaleString() : '—'}
              </div>
              <div className="text-[10px] font-black uppercase tracking-wider text-[#6e9514] mt-1">Occurrences / Year</div>
            </div>
            <div className="bg-[#062115] rounded-2xl p-4 text-center">
              <div className="text-2xl font-black text-[#91c13e]">
                {hours ? hours : '—'}
              </div>
              <div className="text-[10px] font-black uppercase tracking-wider text-[#91c13e]/70 mt-1">Hours Saved</div>
            </div>
          </div>

          {/* Problem */}
          <div>
            <div className="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-2">🔍 The Problem</div>
            <p className="text-sm text-slate-600 font-medium leading-relaxed bg-slate-50 rounded-xl p-4 border border-slate-100">
              {project.description || 'No problem description documented.'}
            </p>
          </div>

          {/* Solution */}
          <div>
            <div className="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-2">💡 The Solution</div>
            <p className="text-sm text-slate-600 font-medium leading-relaxed bg-[#f4f9ec] rounded-xl p-4 border border-[#e4edda]">
              {project.solution || 'No solution documented.'}
            </p>
          </div>

          {/* Footer meta */}
          <div className="flex items-center justify-between text-xs text-slate-400 font-semibold pt-2 border-t border-slate-100">
            <span>Team: <span className="text-slate-600">{project.dept || '—'}</span></span>
            <span>Completed: <span className="text-slate-600">{formatDate(project.endDate)}</span></span>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── WIN CARD ─────────────────────────────────────────────────────────────────
function WinCard({ project, onClick }) {
  const hours = project.effectiveSavings > 0 && project.totalCount > 0
    ? ((project.effectiveSavings * project.totalCount) / 60).toFixed(1)
    : null;

  return (
    <div className="win-card bg-white rounded-2xl shadow-sm border border-slate-100 p-5 cursor-pointer"
      onClick={() => onClick(project)}>
      <div className="flex items-start gap-3 mb-3">
        <div className="w-2 h-2 rounded-full bg-[#91c13e] mt-2 shrink-0" />
        <div className="flex-1 min-w-0">
          <div className="text-[10px] font-black uppercase tracking-widest text-[#91c13e] mb-1">{project.issueKey}</div>
          <h3 className="text-sm font-black text-[#062115] leading-tight line-clamp-2">{project.summary}</h3>
        </div>
      </div>

      <div className="flex items-center gap-2 mb-3">
        <Avatar name={project.reporter} />
        <div>
          <div className="text-xs font-black text-slate-700">{project.reporter}</div>
          <div className="text-[10px] text-slate-400 font-semibold">{project.dept}</div>
        </div>
      </div>

      {hours && (
        <div className="bg-[#062115] rounded-xl px-3 py-2 flex items-center justify-between">
          <span className="text-[10px] font-black uppercase tracking-wider text-[#91c13e]/70">Hours Saved</span>
          <span className="text-sm font-black text-[#91c13e]">{hours} hrs</span>
        </div>
      )}

      <div className="mt-2 text-[10px] text-slate-400 font-semibold text-right">
        {formatDate(project.endDate)}
      </div>
    </div>
  );
}

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
function App() {
  const [rawData, setRawData] = useState([]);
  const [loading, setLoading] = useState(true);
  const [activeTeam, setActiveTeam] = useState('all');
  const [yearFilter, setYearFilter] = useState('All');
  const [searchQuery, setSearchQuery] = useState('');
  const [selectedProject, setSelectedProject] = useState(null);
  const [sortBy, setSortBy] = useState('date'); // date | hours | owner

  useEffect(() => {
    fetchCsv(DEFAULT_CSV_URL).then(rows => {
      if (!rows || rows.length < 2) return;
      const data = [];
      for (let i = 1; i < rows.length; i++) {
        const r = rows[i];
        const issueId = g(r, jCol.issueId);
        if (!issueId || String(issueId).trim() === '') continue;
        const status = String(g(r, jCol.status) || '').trim().toLowerCase();
        const dept = String(g(r, jCol.dept) || '').trim();
        if (!dept || dept === '' || dept.toLowerCase() === 'hr software support') continue;
        if (!RESOLVED_STATUSES.includes(status)) continue;

        const effSav = parseFloat(g(r, jCol.effectiveSavings) || 0);
        const totCount = parseFloat(g(r, jCol.totalCount) || 0);
        const startDate = parseDateSafe(g(r, jCol.startDate)) || parseDateSafe(g(r, jCol.created));
        const endDate = parseDateSafe(g(r, jCol.actualEnd));

        data.push({
          id: i,
          issueKey: g(r, jCol.issueKey) || '—',
          summary: g(r, jCol.summary) || 'Untitled',
          reporter: g(r, jCol.reporter) || 'Unknown',
          dept: dept,
          description: g(r, jCol.description) || '',
          solution: g(r, jCol.solution) || '',
          effectiveSavings: effSav,
          totalCount: totCount,
          startDate,
          endDate,
          year: startDate ? startDate.getFullYear() : null,
        });
      }
      setRawData(data);
      setLoading(false);
    }).catch(() => setLoading(false));
  }, []);

  const yearsOptions = useMemo(() => {
    const yrs = [...new Set(rawData.map(d => d.year).filter(Boolean))].sort((a, b) => b - a);
    return yrs;
  }, [rawData]);

  const filtered = useMemo(() => {
    const teamFull = TEAMS.find(t => t.id === activeTeam)?.full;
    return rawData.filter(d => {
      if (teamFull && d.dept !== teamFull) return false;
      if (yearFilter !== 'All' && String(d.year) !== yearFilter) return false;
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        if (!d.summary.toLowerCase().includes(q) && !d.reporter.toLowerCase().includes(q) && !d.issueKey.toLowerCase().includes(q)) return false;
      }
      return true;
    });

  const sorted = useMemo(() => {
    return [...filtered].sort((a, b) => {
      if (sortBy === 'hours') {
        const ha = (a.effectiveSavings * a.totalCount) / 60;
        const hb = (b.effectiveSavings * b.totalCount) / 60;
        return hb - ha;
      }
      if (sortBy === 'owner') return (a.reporter || '').localeCompare(b.reporter || '');
      // date
      return (b.endDate || 0) - (a.endDate || 0);

  const totalHours = useMemo(() =>
    filtered.reduce((acc, d) => acc + (d.effectiveSavings * d.totalCount) / 60, 0)

  const topContributor = useMemo(() => {
    const counts = {};
    filtered.forEach(d => { counts[d.reporter] = (counts[d.reporter] || 0) + 1; });
    return Object.entries(counts).sort((a, b) => b[1] - a[1])[0] || null;
  }, [filtered]);

v8U3Jb/FNyW/xTclv8U3Jb/FNyX/xTclf8Y1Yv/HM+A/yDMef4iv2c0AAAAAAAAAAAAAAAAAAAAABLemUYV6J7/FeKa/xTblv8U3Jb/FNyW/xTclv8U3Jb/FNyW/xTclv8U3Jb/FNyW/xTclv8U3Jb/FNyW/xTclv8U3Jb/FNyW/xTclv8U3Jb/FNyW/xTclv8V2pP/GNOJ/xzMfv8jvmj/KcVm/ye3X7kAAAAAAAAAAAAAAAAAAAAAAAAAABTel2UW7KH/FeKa/xTblv8U3Jb/FNyW/xTclv8U3Jb/FNyW/xTclv8U3Jb/FNyW/xTclv8U3Jb/FNyW/xTclv8U3Jb/FNyW/xTclv8U25X/FtmR/xnTiP8eyXj/KLpf/yu3Wf8sw2H/KLVb8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABXfmGEV5Zv8Femf/xTblf8U3Jb/FNyW/xTclv8U3Jb/FNyW/xTclv8U3Jb/FNyW/xTclv8U3Jb/FNyW/xTclv8U3Jb/FNuU/xbYkP8Z1or/ItN7/yrBYf8uqkv4KLNW6SrAXd8otlxmAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABXelD4V5ZnYFvGk/xThmv8U25b/FNyW/xTclv8U3Jb/FNyW/xTclv8U3Jb/FNyW/xTclv8U3Jb/FNyV/xXblP8W2JD/G96O/yHMd/8pvmKpMK9NUDGtSh8nxE4NKoAqBgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABXUlQwV5p2FFOOa8RbwpP8V5p3/FN6X/xTclv8U3Jb/FNyW/xTclv8U3Jb/FNyW/xXblf8V3Zb/GOSW/x3gjf8fz3nIJsBpPQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAS5Z4dFeacfBPjmtIU4Zn/Fu6i/xbuo/8W7aH/Feug/xbsof8W7aD/F+ue/xfajvoZ2oq/H9KAWgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABfuny0V5ZthFOGZiRTcl6IT3pmsE92VnxXgloUX45laHOOOJAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" className="w-6 h-6" alt="HelloFresh" style={{filter: "brightness(10)"}} />
          </div>
          <div>
            <span className="font-black text-xl tracking-wider text-white">HELLOFRESH</span>
            <span className="text-[10px] block text-[#91c13e] font-semibold uppercase tracking-widest mt-0.5">CI WINS — EXCELLENCE PORTAL</span>
          </div>
        </div>

        {/* Team tabs */}
        <nav className="flex items-center gap-1.5 overflow-x-auto p-1 bg-black/20 rounded-xl scrollbar-none flex-1 max-w-3xl">
          {TEAMS.map(({ id, label }) => (
            <button key={id} onClick={() => setActiveTeam(id)}
              className={'flex items-center px-4 py-2 rounded-lg font-bold uppercase text-xs tracking-wider transition-all duration-200 shrink-0 ' +
                (activeTeam === id ? 'bg-[#91c13e] text-[#062115] shadow-md font-extrabold' : 'text-gray-300 hover:text-white hover:bg-white/5')}>
              {label}
            </button>
          ))}
        </nav>

        {/* Right buttons */}
        <div className="flex items-center gap-2">
          <a href="https://hellofresh.slack.com/archives/C0BBAAS180L" target="_blank" rel="noopener noreferrer"
            className="flex items-center gap-2 bg-[#4A154B] hover:bg-[#611f69] text-white px-3 py-1.5 rounded-lg text-xs font-black uppercase tracking-wider transition-all">
            <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
              <path d="M5.042 15.165a2.528 2.528 0 0 1-2.52 2.523A2.528 2.528 0 0 1 0 15.165a2.527 2.527 0 0 1 2.522-2.52h2.52v2.52zM6.313 15.165a2.527 2.527 0 0 1 2.521-2.52 2.527 2.527 0 0 1 2.521 2.52v6.313A2.528 2.528 0 0 1 8.834 24a2.528 2.528 0 0 1-2.521-2.522v-6.313zM8.834 5.042a2.528 2.528 0 0 1-2.521-2.52A2.528 2.528 0 0 1 8.834 0a2.528 2.528 0 0 1 2.521 2.522v2.52H8.834zM8.834 6.313a2.528 2.528 0 0 1 2.521 2.521 2.528 2.528 0 0 1-2.521 2.521H2.522A2.528 2.528 0 0 1 0 8.834a2.528 2.528 0 0 1 2.522-2.521h6.312zM18.956 8.834a2.528 2.528 0 0 1 2.522-2.521A2.528 2.528 0 0 1 24 8.834a2.528 2.528 0 0 1-2.522 2.521h-2.522V8.834zM17.688 8.834a2.528 2.528 0 0 1-2.523 2.521 2.527 2.527 0 0 1-2.52-2.521V2.522A2.527 2.527 0 0 1 15.165 0a2.528 2.528 0 0 1 2.523 2.522v6.312zM15.165 18.956a2.528 2.528 0 0 1 2.523 2.522A2.528 2.528 0 0 1 15.165 24a2.527 2.527 0 0 1-2.52-2.522v-2.522h2.52zM15.165 17.688a2.527 2.527 0 0 1-2.52-2.523 2.526 2.526 0 0 1 2.52-2.52h6.313A2.527 2.527 0 0 1 24 15.165a2.528 2.528 0 0 1-2.522 2.523h-6.313z"/>
            </svg>

      </header>

      {/* HERO STRIP */}
      <div className="bg-gradient-to-r from-[#062115] via-[#0d3320] to-[#062115] px-8 py-8 border-b border-[#91c13e]/10">
        <div className="max-w-6xl mx-auto">
          <div className="text-[10px] font-black uppercase tracking-widest text-[#91c13e] mb-2">Continuous Improvement · People Ops</div>
          <h1 className="text-3xl font-black text-white tracking-tight">CI Wins <span className="text-[#91c13e]">🏆</span></h1>
          <p className="text-sm text-white/50 font-semibold mt-1">Celebrating resolved initiatives and the people behind them.</p>
        </div>
      </div>

      <div className="max-w-6xl mx-auto w-full px-4 md:px-8 py-6 flex-1">

        {/* KPI CARDS */}
        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
          <StatCard
            label="Resolved Projects"
            value={loading ? '—' : filtered.length}
            sub={activeTeam === 'all' ? 'Across all teams' : TEAMS.find(t => t.id === activeTeam)?.label}
            icon={<span className="text-xl">✅</span>}
          />
          <StatCard
            label="Total Hours Saved"
            value={loading ? '—' : Math.round(totalHours).toLocaleString() + ' hrs'}
            sub="Sum of (mins × occurrences) / 60"
            icon={<span className="text-xl">⏱️</span>}
            color="text-[#91c13e]"
          />
          <div className="bg-[#062115] rounded-2xl shadow-sm border border-[#91c13e]/20 p-5">
            <div className="text-[10px] font-black uppercase tracking-widest text-[#91c13e]/70 mb-3">🏆 Top Contributor</div>
            {topContributor ? (
              <>
                <div className="flex items-center gap-3 mb-2">
                  <Avatar name={topContributor[0]} />
                  <div>
                    <div className="text-sm font-black text-white">{topContributor[0]}</div>
                    <div className="text-[10px] text-[#91c13e] font-semibold">{topContributor[1]} resolved project{topContributor[1] > 1 ? 's' : ''}</div>
                  </div>
                  <span className="text-2xl ml-auto">🌟</span>
                </div>
              </>
            ) : (
              <div className="text-sm text-white/40 font-semibold">No data yet</div>
            )}
          </div>
        </div>

        {/* FILTERS */}
        <div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-4 mb-6 flex flex-wrap items-center gap-3">
          <select value={yearFilter} onChange={e => setYearFilter(e.target.value)}
            className="bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs font-bold uppercase tracking-wider text-slate-700 outline-none focus:ring-2 focus:ring-[#91c13e] cursor-pointer">
            <option value="All">All Years</option>
            {yearsOptions.map(y => <option key={y} value={y}>{y}</option>)}
          </select>

          <select value={sortBy} onChange={e => setSortBy(e.target.value)}
            className="bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs font-bold uppercase tracking-wider text-slate-700 outline-none focus:ring-2 focus:ring-[#91c13e] cursor-pointer">
            <option value="date">Sort: Latest First</option>
            <option value="hours">Sort: Most Hours Saved</option>
            <option value="owner">Sort: By Owner</option>
          </select>

          <div className="relative flex-1 min-w-48">
            <svg className="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
            <input type="text" placeholder="Search projects or owners..." value={searchQuery}
              onChange={e => setSearchQuery(e.target.value)}
              className="bg-slate-50 border border-slate-200 rounded-xl pl-10 pr-4 py-2.5 text-xs font-bold tracking-wider text-slate-700 placeholder-slate-400 outline-none focus:ring-2 focus:ring-[#91c13e] w-full" />
          </div>

          <div className="text-xs font-black uppercase tracking-wider text-slate-400">
            {filtered.length} WIN{filtered.length !== 1 ? 'S' : ''}
          </div>
        </div>

        {/* WINS GRID */}
        {loading ? (
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            {[...Array(6)].map((_, i) => (
              <div key={i} className="bg-white rounded-2xl h-44 shimmer" />
            ))}
          </div>
        ) : sorted.length === 0 ? (
          <div className="text-center py-20">
            <div className="text-5xl mb-4">🎯</div>
            <div className="text-lg font-black text-slate-400 uppercase tracking-wider">No resolved projects yet</div>
            <div className="text-sm text-slate-400 mt-2">Keep pushing — wins are coming!</div>
          </div>
        ) : (
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            {sorted.map(project => (
              <WinCard key={project.id} project={project} onClick={setSelectedProject} />
            ))}
          </div>
        )}
      </div>

      {/* FOOTER */}
      <div className="text-center py-6 text-xs text-slate-400 font-semibold border-t border-slate-100">
        OPEX CI Excellence Program · People Operations · HelloConnect
      </div>

      {/* MODAL */}
      {selectedProject && (
        <ProjectModal project={selectedProject} onClose={() => setSelectedProject(null)} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
